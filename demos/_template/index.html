<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo title — Client</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/demo-shell.css">
<link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">

<meta name="theme-color" content="#12110e" media="(prefers-color-scheme: dark)">

<script src="/assets/js/deck.js" defer></script>

<!-- class="demo" turns off the rubber-band scroll bounce. -->
<body class="demo">

<div class="demo-bar">
  <a class="demo-bar__back" href="/demos/">&#8592; Demos</a>
  <span class="demo-bar__title">Demo title</span>
  <span style="width:5.5rem"></span><!-- keeps the title optically centred -->
</div>

<div class="demo-stage">

  <!-- ====================================================================
       Your demo goes here. It's a plain HTML page — inline whatever CSS
       and JS you need, or add files alongside this one in the same folder.

       For a slide deck instead, uncomment deck.js above and use:

         <div class="deck" data-deck>
           <section class="slide">
             <p class="eyebrow">Section</p>
             <h2>Slide heading</h2>
             <p>Supporting line.</p>
           </section>
           <section class="slide">…</section>
         </div>

       deck.js builds the nav bar and wires up swipe + arrow keys itself.
       ==================================================================== -->

  <div class="wrap" style="padding-block: clamp(2rem, 8vw, 5rem);">
    <p class="eyebrow">Client name</p>
    <h1>Demo title</h1>
    <p class="lede">Replace this with the demo.</p>
  </div>

</div>

</body>
</html>
