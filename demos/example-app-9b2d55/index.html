<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interactive prototype — Example Client</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/demo-shell.css">
<link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/icon-180.png">

<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="/assets/js/site.js" defer></script>
<script src="/assets/js/demo-shell.js" defer></script>

<style>
  /* Demo-specific styles live inline — this folder stays self-contained. */

  .compare-wrap { padding-block: clamp(1.5rem, 4vw, 3rem); }

  .compare {
    position: relative;
    aspect-ratio: 16 / 10;
    max-height: 60svh;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    overflow: hidden;
    touch-action: none;          /* we own the drag */
    user-select: none;
    -webkit-user-select: none;
    cursor: ew-resize;
  }

  .panel {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 0.75rem;
    padding: 2rem;
    text-align: center;
  }

  .panel--before { background: #ece7df; color: #3d3a33; }
  .panel--after  { background: #17160f; color: #f4efe6; }

  /* The "after" panel is revealed by clipping it to the divider position. */
  .panel--after { clip-path: inset(0 0 0 var(--split, 50%)); }

  .panel h3 { font-size: clamp(1.25rem, 3.5vw, 2rem); margin: 0; color: inherit; }
  .panel p  { font-size: 0.9375rem; margin: 0; opacity: 0.75; max-width: 24ch; }

  .panel .tag {
    font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; opacity: 0.6;
  }

  .divider {
    position: absolute;
    top: 0; bottom: 0;
    left: var(--split, 50%);
    width: 2px;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.15);
    pointer-events: none;
  }

  .knob {
    position: absolute;
    top: 50%; left: var(--split, 50%);
    transform: translate(-50%, -50%);
    width: 52px; height: 52px;     /* comfortably above the 44px floor */
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
    display: grid; place-items: center;
    font-size: 0.9rem; color: #17160f;
    pointer-events: none;
  }

  .readout {
    margin-top: 1.25rem;
    display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem;
    align-items: center;
    font-size: 0.875rem; color: var(--ink-soft);
  }
  .readout output { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
</style>
</head>
<body class="demo">

<div class="demo-bar">
  <a class="demo-bar__back" href="/demos/">&#8592; Demos</a>
  <span class="demo-bar__title">Interactive prototype</span>
  <span style="width:5.5rem"></span>
</div>

<div class="demo-stage">
  <div class="wrap compare-wrap">

    <p class="eyebrow">Example Client · Before &amp; after</p>
    <h1 style="font-size: clamp(1.5rem, 4vw, 2.25rem);">Drag to compare</h1>

    <div class="compare" id="compare" role="slider"
         aria-label="Reveal the after state"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0">
      <div class="panel panel--before">
        <span class="tag">Before</span>
        <h3>The old state</h3>
        <p>Whatever the client is living with today.</p>
      </div>
      <div class="panel panel--after">
        <span class="tag">After</span>
        <h3>The new state</h3>
        <p>What you're proposing instead.</p>
      </div>
      <div class="divider"></div>
      <div class="knob">&#8596;</div>
    </div>

    <div class="readout">
      <span>Reveal: <output id="pct">50%</output></span>
      <span class="muted">Drag, or focus it and use the arrow keys.</span>
    </div>

  </div>
</div>

<script>
(function () {
  "use strict";

  var el  = document.getElementById("compare");
  var pct = document.getElementById("pct");
  var dragging = false;

  function set(value) {
    var v = Math.max(0, Math.min(100, value));
    el.style.setProperty("--split", v + "%");
    el.setAttribute("aria-valuenow", Math.round(v));
    pct.textContent = Math.round(v) + "%";
  }

  function fromEvent(e) {
    var rect = el.getBoundingClientRect();
    set(((e.clientX - rect.left) / rect.width) * 100);
  }

  el.addEventListener("pointerdown", function (e) {
    dragging = true;
    el.setPointerCapture(e.pointerId);
    fromEvent(e);
  });

  el.addEventListener("pointermove", function (e) {
    if (dragging) fromEvent(e);
  });

  ["pointerup", "pointercancel"].forEach(function (evt) {
    el.addEventListener(evt, function () { dragging = false; });
  });

  el.addEventListener("keydown", function (e) {
    var now = parseFloat(el.getAttribute("aria-valuenow"));
    var step = e.shiftKey ? 10 : 2;
    if (e.key === "ArrowRight")      set(now + step);
    else if (e.key === "ArrowLeft")  set(now - step);
    else if (e.key === "Home")       set(0);
    else if (e.key === "End")        set(100);
    else return;
    e.preventDefault();
    e.stopPropagation();   // don't let deck.js-style global handlers see this
  });

  set(50);
})();
</script>

</body>
</html>
